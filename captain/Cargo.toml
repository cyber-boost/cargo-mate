[package]
name = "cargo-mate"
version = "1.7.6"
authors = ["cyber-boost"]
description = "Rust development companion that enhances cargo with intelligent workflows, state management, performance optimization, and comprehensive project monitoring."
edition = "2021"
readme = "README.md"
homepage = "https://cargo.do"
repository = "https://github.com/cyber-boost/cargo-mate"
license = "MIT"
keywords = ["cargo", "rust", "development", "cli", "build-tools"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "target", 
    "releases", 
    "zig-linux-x86_64-0.11.0", 
    "*.sh", 
    "tests", 
    ".git", 
    ".gitignore", 
    "Dockerfile*", 
    ".v", 
    ".cg",
    "src/captain/embedded/",
    "src/captain/sweeping/target/",
]

# Build script for embedding binaries
build = "build_scrub.rs"

[build-dependencies]
tempfile = "3.10"

[[bin]]
name = "cm"
path = "src/main.rs"

[[bin]]
name = "captain"
path = "src/captain/main.rs"

[lib]
name = "cargo_mate"
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0"
atty = "0.2"
base64 = "0.21"
cargo_metadata = "0.18"
console_log = { version = "1.0", optional = true }
colored = "2.1"
log = "0.4"
urlencoding = "2.1"
crossterm = "0.27"
dirs = "5"
glob = "0.3"
handlebars = "5"
indicatif = "0.17"
notify = "6"
notify-debouncer-mini = "0.4"
petgraph = "0.6"
portable-pty = "0.8"
ratatui = "0.26"
regex = "1"
semver = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1.1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
flate2 = "1.0"
tar = "0.4"
subprocess = "0.2"
toml = "0.8"
which = "6"
dotenvy = "0.15"
num_cpus = "1.16"
rand = "0.9.2"
rpassword = "7.2"
rustc_version = "0.4"
thiserror = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit", "visit-mut", "fold"] }
quote = "1.0"
proc-macro2 = "1.0"
walkdir = "2.5"
rayon = "1.10"
tempfile = "3.10"  # For temporary binary extraction

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rand_chacha = "0.9"
blake3 = "1.5"
predicates = "3.1"

[dependencies.prettyplease]
version = "0.2"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[features]
default = []
console_log = ["dep:console_log"]
pristine = []
shine = []
embedded_binary = []

[dependencies.nix]
features = [
    "process",
    "signal",
]
version = "0.27"

[dependencies.reqwest]
version = "0.11"
default-features = false
features = ["json", "blocking", "rustls-tls", "stream"]

[dependencies.tokio]
features = ["full"]
version = "1"

[profile.dev]
codegen-units = 128
debug = 1
#lto = false
opt-level = 1

[profile.release]
opt-level = 3
#lto = true
codegen-units = 1
#strip = true
#embed-bitcode = true  # Explicitly enable bitcode embedding

# Special handling for proc-macro crates
[profile.release-macros]
inherits = "release"
#lto = false  # Disable LTO for proc-macro crates
opt-level = 3
codegen-units = 16
#strip = true

# Use release-macros profile for proc-macro crates
[profile.release.package.serde_derive]
inherits = "release-macros"
[profile.release.package.syn]
inherits = "release-macros"
[profile.release.package.quote]
inherits = "release-macros"
[profile.release.package.proc-macro2]
inherits = "release-macros"

# Built by Bernie and Buddy
# mate@cargo.do if you need help